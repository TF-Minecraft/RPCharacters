enabled: true
protect-by-default: true
hologram-show-killer: true
snapshot-interval-ticks: 20
# 0 = never
expire-seconds: 1200
material: CHEST
hologram-offset-y: 1.2
hologram-radius: 32
hologram-timer-format: "&7Despawns in &e{time}"
hologram-timer-expiring: "&7Despawning..."

# Optional: never copy these slots at all.
# excluded-slots: []

# TLibs paths skipped only in that slot (stash, not grave).
# v.diamond_hoe matches remodeled vanilla hoes; MMOItems in these slots still go in the grave.
excluded-slot-items:
  9:
    - v.diamond_hoe
  10:
    - v.diamond_hoe
  11:
    - v.diamond_hoe
  12:
    - v.diamond_hoe

# TLibs item paths that never enter a grave (any slot).
excluded-items:
  - m.miscellanea.grave_insurance

# Right-click to recover your newest grave from anywhere (consumes one charge on success).
insurance:
  item: m.miscellanea.grave_insurance
  consume: true

messages:
  locked: "&cThis grave is locked."
  recovered: "&aYou recovered your belongings."
  looted: "&aYou looted this grave."
  inventory-full: "&eSome items did not fit and were dropped."
  empty: "&7There is nothing left here."
  placed: "&eYour grave was placed at &f{x}, {y}, {z} &ein {world}."
  unlock-hint: "&eRun &f/grave unlock &eto let others loot this grave."
  # Shown instead of unlock-hint when an evil RP victim dies in a /pvp start fight.
  unlocked-evil-rp: "&cYou were in an evil RP session, so your grave is unlocked. Anyone can loot it."
  insurance-none: "&eYou have no grave to recover."
  unlock-none: "&eYou have no grave to unlock."
  unlock-already: "&eYour grave is already unlocked."
  unlock-success: "&aYour grave is now unlocked. Anyone can loot it."
  rob-hint: "&aRight click to rob"
