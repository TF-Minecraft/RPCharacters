enabled: true
protect-by-default: true
hologram-show-killer: true
snapshot-interval-ticks: 20
# 0 = never
expire-seconds: 1200
material: CHEST
hologram-offset-y: 1.2
hologram-radius: 32
hologram-timer-format: "&7Despawns in &e{time}"
hologram-timer-expiring: "&7Despawning..."

# Optional: never copy these slots at all.
# excluded-slots: []

# TLibs paths skipped only in that slot (stash, not grave).
# v.diamond_hoe matches remodeled vanilla hoes; MMOItems in these slots still go in the grave.
excluded-slot-items:
  9:
    - v.diamond_hoe
  10:
    - v.diamond_hoe
  11:
    - v.diamond_hoe
  12:
    - v.diamond_hoe

# TLibs item paths that never enter a grave (any slot).
excluded-items:
  - m.miscellanea.grave_insurance

# By default any ticket recovers your newest grave, even if bought after death.
# Loose tickets stay with you on respawn and remain interchangeable.
# Set require-ticket-at-death to true to bind one carried ticket at death instead.
# In that mode a ticket inside a bundle is extracted, bound, and returned on respawn.
# Both modes recover remotely and respect grave access restrictions.
insurance:
  item: m.miscellanea.grave_insurance
  consume: true
  require-ticket-at-death: false
  # Lore line added to the bound ticket. Placeholders: {x} {y} {z} {world}. Empty = none.
  bound-lore: "&7Bound to your grave at &f{x}, {y}, {z}"

messages:
  locked: "&cThis grave is locked."
  recovered: "&aYou recovered your belongings."
  looted: "&aYou looted this grave."
  inventory-full: "&eSome items did not fit and were dropped."
  empty: "&7There is nothing left here."
  placed: "&eYour grave was placed at &f{x}, {y}, {z} &ein {world}."
  unlock-hint: "&eRun &f/grave unlock &eto let others loot this grave."
  # Shown instead of unlock-hint when an evil RP victim dies in a /pvp start fight.
  unlocked-evil-rp: "&cYou were in an evil RP session, so your grave is unlocked. Anyone can loot it."
  # Shown instead of unlock-hint when a strike kills the character. Only the killer can open that grave.
  killer-only: "&cYour character died from a strike. Only your killer can open this grave."
  unlock-killer-only: "&cOnly the killer can open this grave. It can't be unlocked."
  insurance-no-grave: "&eYou have no grave to recover."
  insurance-none: "&eThis ticket is not bound to a grave. Carry it when you die to insure that grave."
  insurance-gone: "&eThe grave this ticket was bound to is gone."
  # Shown after respawn when a ticket was bound to the new grave.
  insurance-bound: "&aOne of your insurance tickets is now bound to this grave. Right click it to recover your items."
  unlock-none: "&eYou have no grave to unlock."
  unlock-already: "&eYour grave is already unlocked."
  unlock-success: "&aYour grave is now unlocked. Anyone can loot it."
  rob-hint: "&aRight click to rob"
