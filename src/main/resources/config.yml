continent: Cerrith

attributes:
    - strength
    - dexterity
    - constitution
    - intelligence
    - wisdom
    - charisma
ignored-attributes:
    - nutrition
professions:
    - miner(#b57f6eMiner Experience)
    - smith(#b57f6eSmith Experience)
    - alchemist(#b57f6eAlchemist Experience)
    - engineer(#b57f6eEngineer Experience)
    - forester(#b57f6eForester Experience)
    - agriculturist(#b57f6eAgriculturist Experience)

background-trait-types:
    - homeland
    - cataclysm
    - reclamation
    - motivation
    - gift
    - virtue
    - combat
    - physical
    - celestial
    - attributes

editable-trait-types:
    - personality
    - evil

base-profession-factor: -10

require-character: true

# Verbose RPCharacters feedback when /mmocore admin skill-points give|set runs (sync breakdown, stripped skills).
skill-points-admin-debug-messages: false

# Verbose RPCharacters feedback when /mmocore admin attribute-points give|set runs.
attribute-points-admin-debug-messages: false

default-clues-required: 2
evil-clues-required: 4
# Account age (hours since account createdAt) required to pick evil archetypes.
evil-min-account-age-hours: 24
clue-min-length: 12
clue-max-length: 48
max-clues: 10

character-description:
  length-minimum: 32
  length-maximum: 256

trait-clue-overrides: {}

no-character-freeze: true
lacking-clues-freeze: true
excess-characters-freeze: true

race-clue: "This seems to be the mark of {a/an} {race}"

spawned-clue-timer: 48
spawned-clue-visual-y-offset: 0.2
spawned-clue-line-spacing: 0.22
spawned-clue-first-line-offset: 0.18
spawned-clue-scale: 0.6
spawned-clue-particle-interval: 10
spawned-clue-line-length: 18
clue-spawn-radius: 3

conversation:
  reply-timeout-seconds: 30
  pair-cooldown-hours: 2

rp-injure:
  range: 10
  timeout-seconds: 30

# Class and subclass picks for the active character, through /class (and the commands below),
# /rpcharacter class, the Class button in Character Info, and the class entry in /rpcharacter edit.
# /subclass and /rpcharacter subclass open a separate window for your current class family.
# They replace MMOCore class points: the commands below open this picker instead of MMOCore's.
# A character's first class and its first subclass are free. Every other pick is a class change,
# priced like class_selection_stage: free during its lock-time, then the paid-changes class rule
# (shared count, so 100, 1000, 3000). change-cost is used only when there is no class rule.
# infinite-points: every pick is free and unlimited (tutorial servers).
# accounts: where to take the denars from, tried in order. The whole cost comes from one account.
# reset-permission: staff permission for /rpcharacter admin resetclasses confirm. It gives every
# character a fresh class_selection_stage lock-time (free class and subclass changes, paid prices
# start over, first subclass free again). Online characters start now, offline ones on next join.
class-selection:
  enabled: true
  infinite-points: false
  change-cost: 200
  accounts: [pouch, bank]
  commands: [class, c]
  reset-permission: rpchar.class.reset

# Pay to change a choice after its stage's lock-time runs out (class is locked after 5d).
# With class-selection enabled, the class rule prices the class picker instead of the edit stage.
# Players pay when they open the choice, and get the denars back if they leave without changing it.
# costs: the first paid change, the second, and so on. The last cost repeats after that.
# accounts: where to take the denars from, tried in order. The whole cost comes from one account.
paid-changes:
  accounts: [pouch, bank]
  rules:
    class:
      stage: class_selection_stage
      label: class
      costs: [100, 1000, 3000]
