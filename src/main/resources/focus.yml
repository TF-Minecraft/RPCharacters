# Character-keyed mental points (Focus). Not stats.
# Consumed by Research experiments and Magic meditation.

max: 150
base_per_hour: 10
regen_interval_ticks: 72000
offline_regen: true

# MMOCore attribute bonuses to hourly regen.
regen_bonuses:
  - mmocore_id: wisdom
    extra_per_hour_per_point: 0.5
  - mmocore_id: intelligence
    extra_per_hour_per_point: 0.25

# Items that restore focus on right-click (TLibs item paths). One item is used
# per click; nothing is used while focus is already full.
restore_items:
  minor_focus_potion:
    item: m.medicines.MINOR_FOCUS_POTION
    points: 50
