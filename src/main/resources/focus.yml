# Character-keyed mental points (Focus). Not stats.
# Consumed by Research experiments and Magic meditation.

max: 150
base_per_hour: 10
regen_interval_ticks: 72000
offline_regen: true

# MMOCore attribute bonuses to hourly regen.
regen_bonuses:
  - mmocore_id: wisdom
    extra_per_hour_per_point: 0.5
  - mmocore_id: intelligence
    extra_per_hour_per_point: 0.25
