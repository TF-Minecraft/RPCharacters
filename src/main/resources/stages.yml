evil_locked_info_stage:
  type: info
  repeat: true
  interval: 60
  auto-next: false
  require-account-age-hours-max: 24
  dependency:
    type: trait
    mode: one-or-more
    depends-on:
    - callous
    - spiteful
    - greedy
    - deceitful
    - cynical
  messages:
  - title(§aEvil RP)
  - subtitle(§eYour character has traits compatible with Evil RP)
  - subtitle(§eYou cannot select Evil archetypes yet)
  - subtitle(§eUnlock selecting an evil character after {hours} hours on the server)
  - subtitle(§eThis is based on your account age, not this character)
  - 'subtitle(§eUse #32ed73/rpcharacter next§e to move on)'
  web-messages:
  - title(Evil RP)
  - subtitle(Your character has traits compatible with Evil RP, but you cannot select Evil archetypes yet.)
  - subtitle(Unlock selecting an evil character after {hours} hours on the server. This is based on your account age, not this character.)
evil_info_stage:
  type: info
  repeat: true
  interval: 60
  auto-next: false
  require-account-age-hours-min: 24
  dependency:
    type: trait
    mode: one-or-more
    depends-on:
    - callous
    - spiteful
    - greedy
    - deceitful
    - cynical
  messages:
  - title(§aEvil RP)
  - subtitle(§eYour character has traits compatible with Evil RP)
  - subtitle(§eOn the next stage you may select up to 2 Evil archetypes)
  - subtitle(§eYou can select nothing and click confirm to skip)
  - subtitle(§eMake sure you read the Evil RP rules if you are Evil)
  - 'subtitle(§eUse #32ed73/rpcharacter next§e to move on)'
  web-messages:
  - title(Evil RP)
  - subtitle(Your character has traits compatible with Evil RP. On the next step you may pick up to two Evil archetypes, or skip.)
  - subtitle(Make sure you read the Evil RP rules if you go evil.)
evil_selection_stage:
  type: selection
  lock-time: 5d
  repeat: true
  target: trait
  key: evil
  min-select: 0
  max-select: 2
  require-account-age-hours-min: 24
  dependency:
    type: trait
    mode: one-or-more
    depends-on:
    - callous
    - spiteful
    - greedy
    - deceitful
    - cynical
  slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
permanent_injury_info_stage:
  type: info
  repeat: true
  interval: 60
  auto-next: false
  messages:
  - title(§aBackstory Injuries)
  - subtitle(§eOptional permanent injuries from your character's past)
  - subtitle(§eThese cost no points and you may pick several)
  - subtitle(§eYou can skip this step if your character has no injuries)
  - subtitle(§eOn the next stage, select any that apply and click confirm)
  - 'subtitle(§eUse #32ed73/rpcharacter next§e to move on)'
  web-messages:
  - title(Backstory Injuries)
  - subtitle(Optional permanent injuries from your character's past. These cost no points and you may pick several.)
  - subtitle(You can skip this step if your character has no injuries. On the next step, select any that apply.)
permanent_injury_selection_stage:
  type: selection
  lock-time: 24h
  repeat: true
  target: trait
  key: injury
  filter: permanent-only
  min-select: 0
  max-select: 99
  gui-size: 54
  slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
prosthetic_info_stage:
  type: info
  repeat: true
  interval: 60
  auto-next: false
  messages:
  - title(§aBackstory Prosthetic)
  - subtitle(§eOptional prosthetic from your character's past)
  - subtitle(§eCosts 1 point and you may pick at most one)
  - subtitle(§eYou do not need a matching injury to pick a prosthetic)
  - subtitle(§cArcane prosthetics require fuel to stay powered)
  - subtitle(§eYou can skip by confirming with nothing selected)
  - 'subtitle(§eUse #32ed73/rpcharacter next§e to move on)'
  web-messages:
  - title(Backstory Prosthetic)
  - subtitle(Optional prosthetic from your character's past. Costs 1 point and you may pick at most one.)
  - subtitle(You do not need a matching injury. Arcane prosthetics require fuel to stay powered. You can skip this step.)
