creation_description_stage:
  type: info
  repeat: false
  interval: 60
  auto-next: false
  messages:
  - title(§aCharacter Description)
  - subtitle(§eWrite a short description of your character)
  - subtitle(§eIt must be between 32 and 256 characters)
  - subtitle(§eDescribe how they look, sound, and come across)
  - subtitle(§eKeep it clear enough for others to roleplay with)
  - 'subtitle(§eUse #32ed73/rpcharacter next§e to move on)'
  web-messages:
  - title(Character Description)
  - subtitle(Write a short description of your character. It must be between 32 and 256 characters.)
  - subtitle(Describe how they look, sound, and come across. Keep it clear enough for others to roleplay with.)
creation_description_set_stage:
  type: setter
  target: description
  repeat: true
  auto-next: true
  message: subtitle(§7Type your character description in chat)
clue_info_stage:
  type: info
  repeat: false
  interval: 60
  auto-next: false
  messages:
  - title(§aCharacter Clues)
  - subtitle(§eClues are how others know your character)
  - subtitle(§eVisual features, smells, home, habits, and so on)
  - subtitle(§eEvil characters need more clues)
  - subtitle(§eLow effort or false clues can be punished)
  - 'subtitle(§eUse #32ed73/rpcharacter help§e to read this stage in chat)'
  - 'subtitle(§eUse #32ed73/rpcharacter next§e to move on)'
  web-messages:
  - title(Character Clues)
  - subtitle(Clues are how others know your character, visual features, smells, home, habits, and so on.)
  - subtitle(Evil characters need more clues. Low effort or false clues can be punished.)
clue_entry_stage:
  type: clue
  repeat: true
  auto-next: true
  message: subtitle(§7Type clue {current}/{needed} in chat)
creation_wardrobe_info_stage:
  type: info
  platform: game
  repeat: false
  interval: 60
  auto-next: false
  messages:
  - title(§aCharacter Skins)
  - subtitle(§eOptional player skins live on the website)
  - subtitle(§eAfter create, open your character → Wardrobe)
  - 'subtitle(§eIn-game swap with #32ed73/rpcharacter wardrobe)'
  - 'subtitle(§eUse #32ed73/rpcharacter next§e to move on)'
creation_wardrobe_stage:
  type: wardrobe
  platform: web
  repeat: false
  auto-next: false
  web-messages:
  - title(Character Skins)
  - subtitle(Optional. Upload a base skin, extras by rank, and a masked look. You can skip and edit later on your character page.)
creation_summary_stage:
  type: summary
  repeat: true
  auto-next: false
  entries:
    name: creation_name_set_stage
    class: class_selection_stage
    race: race_selection_stage
    age: character_age_stage
    description: creation_description_set_stage
    homeland: homeland_selection_stage
    cataclysm: cataclysm_selection_stage
    reclamation: reclamation_selection_stage
    motivation: motivation_selection_stage
    gift: gift_selection_stage
    virtue: virtue_selection_stage
    combat: combat_selection_stage
    physical: physical_selection_stage
    celestial: celestial_selection_stage
    attributes: attributes_selection_stage
    personality: personality_selection_stage
    evil: evil_selection_stage
    permanent_injury: permanent_injury_selection_stage
    prosthetic: prosthetic_selection_stage
    clues: clues
