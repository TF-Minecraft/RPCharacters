# Evil RP sessions.
# Lockpicking, robbing, pickpocketing and looting locked graves (from Thievery)
# start a session, or reset it to full length. Strikes only come from /pvp start
# fights (see pvp.yml). While a session runs, any strike kills the character and
# a death to another player leaves an unlocked grave anyone can loot.

# How long a session lasts after the latest evil play. Keeps counting while offline.
session-minutes: 30
