# Tier order controls which rank is shown on locked character slots ("requires at least …").
# visible defaults to true; set visible: false for staff/helper groups players cannot acquire.
# wardrobe-skin-slots: swappable skins per character, 1 to 5 (base + Skin 2 … Skin 5).
# TFMCWebBridge's player-meta.rpc ladder sends the website the same character and wardrobe
# numbers: keep both files in step.
defaults:
  name-colour-stops: 0
  character-switch-cooldown-days: 4
  max-alive-characters: 3
  wardrobe-skin-slots: 1

groups:
  noble:
    tier: 1
    permission: rpchar.group.noble
    display-name: "&#2981C4N&#276EC1o&#265CBEb&#2549BBl&#2337B8e&#2224B5"
    name-colour-stops: 1
    character-switch-cooldown-days: 3
    max-alive-characters: 3
    wardrobe-skin-slots: 2
  gilded:
    tier: 2
    permission: rpchar.group.gilded
    display-name: "&#FDAA17G&#FB9C14i&#F98E12l&#F67F10d&#F4710Ee&#F2630Bd&#F05509"
    name-colour-stops: 2
    character-switch-cooldown-days: 2
    max-alive-characters: 4
    wardrobe-skin-slots: 3
  ascended:
    tier: 3
    permission: rpchar.group.ascended
    display-name: "&#8939EE&lA&#9033DD&ls&#972DCC&lc&#9E27BB&le&#A620AB&ln&#AD1A9A&ld&#B41489&le&#BB0E78&ld&#C20867"
    name-colour-stops: 20
    character-switch-cooldown-days: 1
    max-alive-characters: 5
    wardrobe-skin-slots: 5
  legacy:
    tier: 4
    permission: rpchar.group.legacy
    display-name: "&#3AE38C&lL&#33CB7C&le&#2CB36C&lg&#259C5D&la&#1E844D&lc&#176C3D&ly&#10542D&l"
    name-colour-stops: 20
    character-switch-cooldown-days: 1
    max-alive-characters: 5
    wardrobe-skin-slots: 5
  # Staff and helpers: hidden, so never named on locked slots or wardrobe frames.
  # Grant rpchar.group.staff to the base LuckPerms group of every staff and helper
  # track (staff_player, helper_player, helper+_player) so it holds on and off duty.
  staff:
    tier: 100
    visible: false
    permission: rpchar.group.staff
    display-name: "Staff"
    character-switch-cooldown-days: 0
    max-alive-characters: 8
    wardrobe-skin-slots: 5
