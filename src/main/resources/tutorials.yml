# Chat tutorials. Each one shows until the player clicks [Got It] under it.
# Lines take & or § colour codes and #rrggbb hex. Some tutorials fill in
# {placeholders}; those are listed above the tutorial.
tutorials:
  # Shown when entering a permadeath zone.
  permadeath-zone:
    lines:
      - "#d65c5cPermadeath Zone"
      - "§7Death here might permakill your character."
      - "§7If you are lucky you might gain a healing injury instead."
      - "§7Healing injuries recover over time while you are active online."
      - "§7Another death here can turn healing injuries permanent."
      - "§7Surgery treats healing injuries only."
      - "§7Prosthetics can replace some permanent injuries."
      - "§7More injuries raise your permakill chance."

  # Shown when an evil RP session starts. {minutes} is the session length,
  # {strikes} the character's current strikes.
  evil-rp:
    lines:
      - "#d65c5cEvil RP"
      - "§7You've started an evil RP session. It lasts {minutes} minutes."
      - "§7Picking a lock, robbing, pickpocketing or looting a locked grave sets it back to {minutes}."
      - "§7If you're killed or knocked out in a §c/pvp start §7fight before it runs out, your killer can spare or kill you."
      - "§7During a session any strike kills your character, no matter how many strikes you have ({strikes} so far)."
      - "§7If another player kills you, your grave is left unlocked and anyone can loot it."
      - "§7You can't switch characters until it's over. Check with §a/rpcharacter strikes§7."

  # Shown to everyone caught in a /pvp start. {seconds} is how long a killer has to choose.
  pvp-strikes:
    lines:
      - "#d65c5cPvP Strikes"
      - "§7Someone started a fight near you. If another player kills you or knocks you out in it, they decide your fate."
      - "§7They have {seconds} seconds to §aspare §7you or give you a §cstrike§7. If they don't choose, you're spared."
      - "§7First strike is a healing injury, the second a permanent one. The third kills your character."
      - "§7When a strike would kill you, they can also §ewound §7(healing injury) or §6maim §7(permanent injury) you instead, with no strike."
      - "§7In an evil RP session any strike kills, and if a player kills you your grave is left unlocked."
      - "§7Deaths with no player to blame don't count. Check your strikes with §a/rpcharacter strikes§7."
