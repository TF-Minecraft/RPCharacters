bypass-cooldown-perm: rpchar.chat.bypasscooldown
default: rp
no-character-message: '&cNo active character. &e/rpcharacter &cto create one, or &e/ooc &cfor OOC.'

channel-switcher:
  enabled: true
  switchable-channels:
    - rp
    - ooc
    - looc
    - whisper
    - shout
    - yell
    - action

channel-toggler:
  enabled: true
  toggleable-channels:
    - looc
    - ooc
    - helper
    - admin
    - gooc
    - fooc
    - pooc

messages:
  run-as-player: '&cPlayers only.'
  channel-switch-disabled: '&cChannel switching is disabled.'
  channel-toggle-disabled: '&cChannel toggling is disabled.'
  invalid-use: '&cBad syntax. Try /{usage}.'
  invalid-channel: '&cYou cannot target that channel. Allowed channels: {channels}.'
  already-switched: '&cYou are already using that channel.'
  switched: '&aSwitched to {channel}.'
  current-channel: '&7Your default chat channel is &e{channel}&7.'
  toggled-on: '&aToggled {channel} visibility ON.'
  toggled-off: '&eToggled {channel} visibility OFF.'
  cant-use-when-toggled-off: '&cChannel is toggled off. Toggle it back on.'

channels:
  rp:
    commands: [rp]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    masked: true
    format: '&f{display}&e: &f"&e{message}&f"'
    bubble: true
    smart-messages: true
    range: 15
    cooldown: 0

  shout:
    commands: [shout]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    masked: true
    format: '&f{display}&6 shouts: &f"&6{message}&f"'
    bubble: true
    smart-messages: true
    range: 24
    cooldown: 0

  yell:
    commands: [yell, y]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    masked: true
    format: '&f{display}&c yells: &f"&c&l{message}&f"'
    bubble: true
    smart-messages: true
    range: 48
    cooldown: 0

  whisper:
    commands: [whisper, wh]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    masked: true
    format: '&f{display}#55aaff whispers: &f&o"#55aaff&o{message}&f&o"'
    smart-messages: true
    range: 2
    cooldown: 0

  looc:
    commands: [looc]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    masked: true
    format: '&f[&2LOOC&f] &f{player}: &7{message}'
    range: 20
    cooldown: 0

  ooc:
    commands: [ooc]
    require-character: false
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    format: '&f[&9OOC&f] &f{player}: &7{message}'
    cooldown: 0

  action:
    commands: [me]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    masked: true
    format: '&e* &f{display} &d{message}'
    range: 20
    cooldown: 0

  admin:
    commands: [admin, a]
    require-character: false
    use-perm: rpchar.chat.admin
    read-perm: rpchar.chat.admin
    color-code-perm: rpchar.chat.colors
    format: '&f[&cAdmin&f] &e{player}: &f{message}'

  helper:
    commands: [helper, h]
    require-character: false
    use-perm: rpchar.chat.helper
    read-perm: rpchar.chat.helper
    color-code-perm: rpchar.chat.colors
    format: '&f[&dHelper&f] &e{player}: &f{message}'

  dm:
    commands: [dm, narrate]
    require-character: false
    use-perm: rpchar.chat.admin
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    format: '&7{message}'
    range: 64
    cooldown: 0

  scene:
    commands: [scene]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    format: '&7&o*{message}*'
    range: 20
    bubble: false
    smart-messages: false
    cooldown: 0

  gooc:
    commands: [gooc]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    format: '&f[&6GOOC&f] &f{player}: &7{message}'
    recipient-resolver: simplefactions:guild
    cooldown: 3
    bubble: false
    smart-messages: false

  fooc:
    commands: [fooc]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    format: '&f[&bFOOC&f] &f{player}: &7{message}'
    recipient-resolver: simplefactions:faction
    cooldown: 3
    bubble: false
    smart-messages: false

  rooc:
    commands: [rooc]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    require-character: false
    format: '&f[&dROOC&f] &f{player}: &7{message}'
    recipient-resolver: simplefactions:realm
    cooldown: 3
    bubble: false
    smart-messages: false

  pooc:
    commands: [pooc]
    use-perm: rpchar.chat.use
    read-perm: rpchar.chat.use
    color-code-perm: rpchar.chat.colors
    format: '&f[&dPOOC&f] &f{player}: &7{message}'
    recipient-resolver: rpcharacters:party
    cooldown: 3
    bubble: false
    smart-messages: false
