main: net.tfminecraft.rpcharacters.RPCharacters
api-version: '1.21.10'
name: RPCharacters
version: ${project.version}
author: Drefvelin

depend: [TLibs, MMOCore, TFMCWeb, MMOItems, MythicLib]
softdepend: [ProtocolLib, PlaceholderAPI, LuckPerms, WorldGuard, SimpleFactions, GSit, Codex, ModelEngine]

commands:
  plushie:
    description: Create a plushie from a character's wardrobe outfit
    usage: /plushie <character name or UUID> [1|2|3]
    permission: rpchar.plushie.give
  class:
    description: Choose your character's base class
    aliases: [c]
  subclass:
    description: Choose a subclass of your character's class
  focus:
    description: Manage character focus
    usage: /focus <get|restore|reset> <player> | /focus <set|add|remove> <player> <points> | /focus reload
    permission: rpchar.focus.admin
  rpcharacter:
    useage: /<command>
    description: RPCharacters Command
  roll:
    usage: /<command> [max|attribute] [+/-modifier]
    description: Roll dice
  profession:
    usage: /<command>
    description: Profession menu and admin tools
    permission: rpchar.profession.use
  channel:
    usage: /<command> [channel]
    description: Switch your default chat channel for plain typing
  channeltoggle:
    usage: /<command> <channel>
    description: Toggle visibility of a chat channel
  pvp:
    usage: /<command> <start|end|lethal|nonlethal>
    description: PvP start warning, situation timeout, and lethal or nonlethal mode
    permission: rpchar.pvp
  duel:
    usage: /<command> [player] | accept [player] | decline [player] | cancel | yield
    description: Challenge a player to a friendly duel that nobody dies or loses anything in
    permission: rpchar.duel
  grave:
    usage: /<command> unlock
    description: Unlock your newest grave so others can loot it
  players:
    usage: /<command>
    description: Open the online player list
  will:
    usage: /<command>
    description: Name or revoke your character's heir
  estate:
    usage: /<command> collect | list | show | hold | release | decide | assign | retry | waive | revert
    description: Collect an inheritance; staff estate tools
permissions:
  rpchar.plushie.give:
    description: Create plushies from character wardrobe outfits
    default: op
  rpchar.focus.admin:
    description: Restore character focus and reload focus configuration
    default: op
  rpchar.profession.use:
    default: true
  rpchar.playerlist:
    description: Open the online player list
    default: true
  rpchar.pvp:
    default: true
  rpchar.duel:
    description: Challenge players to friendly duels
    default: true
  rpchar.injure:
    default: true
  rpchar.grave.protect:
    default: true
  rpchar.grave.admin:
    default: op
  rpchar.estate.admin:
    description: Staff estate tools (/estate list, show, hold, assign and the rest)
    default: op
  rpchar.prison:
    description: Mark imprisoned characters to switch in and out without the switch cooldown (/rpcharacter admin prison)
    default: op
  rpchar.class.reset:
    description: Reset class picks for every character (class-selection.reset-permission)
    default: op
  professions.admin:
    default: op
