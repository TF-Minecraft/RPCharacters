main: net.tfminecraft.rpcharacters.RPCharacters
api-version: '1.21.10'
name: RPCharacters
version: ${project.version}
author: Drefvelin

depend: [TLibs, MMOCore, TFMCWeb, MMOItems, MythicLib]
softdepend: [ProtocolLib, PlaceholderAPI, LuckPerms, WorldGuard, SimpleFactions]

commands:
  focus:
    description: Manage character focus
    usage: /focus restore <player> | /focus reload
    permission: rpchar.focus.admin
  rpcharacter:
    useage: /<command>
    description: RPCharacters Command
  roll:
    usage: /<command> [max|attribute] [+/-modifier]
    description: Roll dice
  profession:
    usage: /<command>
    description: Profession menu and admin tools
    permission: rpchar.profession.use
  channel:
    usage: /<command> [channel]
    description: Switch your default chat channel for plain typing
  channeltoggle:
    usage: /<command> <channel>
    description: Toggle visibility of a chat channel
  pvp:
    usage: /<command> <start|lethal|nonlethal>
    description: PvP start warning and lethal or nonlethal mode
    permission: rpchar.pvp
  grave:
    usage: /<command> unlock
    description: Unlock your newest grave so others can loot it
  players:
    usage: /<command>
    description: Open the online player list
permissions:
  rpchar.focus.admin:
    description: Restore character focus and reload focus configuration
    default: op
  rpchar.profession.use:
    default: true
  rpchar.playerlist:
    description: Open the online player list
    default: true
  rpchar.pvp:
    default: true
  rpchar.injure:
    default: true
  rpchar.grave.protect:
    default: true
  rpchar.grave.admin:
    default: op
  professions.admin:
    default: op