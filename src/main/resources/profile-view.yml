permission: rpchar.profile

view:
  require-sneak: true
  require-empty-hand: true
  cooldown-seconds: 0

format:
  - "&e{display_tab}'s &7Character Description:"
  - "&fName: &e{display_tab}"
  - "&fGender: &e{gender}"
  - "&fAge: &e{age}"
  - "&fBirthday: &e{birthday}"
  - "&fRace: &e{race}"
  - ""
  - "&fDescription:"
  - "&7{description}"

# G-menu character sheet; the character name is already in the dialog title.
sheet-format:
  - "&fGender: &e{gender}"
  - "&fAge: &e{age}"
  - "&fBirthday: &e{birthday}"
  - "&fRace: &e{race}"
  - ""
  - "&fDescription:"
  - "&7{description}"
