# /pvp start warning, PvP modes and nonlethal knockout
#
# Every character is nonlethal when it becomes active: after logging in, after a
# restart and after switching character. A nonlethal player's killing blow knocks the
# victim out instead. /pvp lethal shows messages.lethal-warning and must be confirmed
# with /pvp lethal confirm within lethal-confirm-seconds. Lethal is never saved.
start-radius: 16
start-warn-seconds: 10
start-countdown-from: 5
# After the countdown, how long the situation lasts. When it runs out, players
# who have not died see a title that it has ended and a new RP interaction is
# needed. The player who ran /pvp start can end it sooner with /pvp end.
# 0 disables the timeout. Dying, being knocked out, or logging out ends strike
# eligibility early. In this window a lethal player's kill gives the victim a strike
# at once, and a nonlethal player's knockout lets them spare or strike the victim
# (see strikes below). A death to a player who cannot loot graves keeps the victim's
# items unless the character dies from it. Their coin pouch still drops.
start-active-minutes: 15
lethal-confirm-seconds: 30
# Knockouts outside a /pvp start last this long. In a /pvp start the victim stays down
# until the winner decides (strikes.decision-seconds at most).
knockout-seconds: 30
# Blindness for this many seconds after going down (never longer than the knockout).
# 0 = no blindness.
knockout-blindness-seconds: 60
# Minecraft effect level 5 = amplifier 4
blindness-amplifier: 4
# 1 tick = 20Hz freeze loop (only knocks out players)
freeze-period-ticks: 1

# Strikes from deaths and knockouts during a PvP start. SimpleFactions battles and
# duels never give strikes. The first strike is a healing injury, the second a
# permanent one, and the third kills the character. In an evil RP session any strike
# kills. A lethal player's kill always strikes, or kills when the strike would kill,
# and the dead character's grave can only be opened by the killer. After a nonlethal
# knockout the winner chooses: Spare or Strike, and when a strike would kill, Wound
# (healing injury) or Maim (permanent injury) instead, with no strike added, or Kill.
# The same player cannot strike the same character again until the cooldown below
# has passed.
strikes:
  # How long the winner of a knockout has to choose. The victim stays knocked out,
  # unhurt and unable to fight until then, but can still talk. No choice means spare.
  decision-seconds: 300
  # Hours before that same player can strike this character again.
  # The 24 hour default stops one person landing all three strikes in a single day.
  # 0 disables the wait.
  same-target-cooldown-hours: 24
  # When enabled, one strike wears off after this many days without a new one.
  decay:
    enabled: false
    days: 14

# Armour can't be thrown on the moment a fight looks likely.
armour:
  # Seconds to fasten each piece. Pieces go on one after another, with the
  # player slowed. Taking or dealing damage, sprinting, dying or logging out
  # stops it. 0 puts that piece on at once. Masks, heads and elytras are never
  # delayed, nor are creative or spectator players.
  don-seconds:
    helmet: 1
    chestplate: 4
    leggings: 3
    boots: 2
  # Slowness while fastening (0 = Slowness I). -1 for none.
  slowness-amplifier: 1

messages:
  start-warning: "&ePvP will start in {seconds} seconds! &7Lethal kills in this fight give strikes, and a knocked out player's fate is up to the winner."
  countdown: "&c{count}"
  started-title: "&cPVP STARTED"
  situation-duration: "&eThis PvP situation lasts {minutes} minutes. &7After that, a new RP interaction is needed."
  ended-title: "&c&lPVP SITUATION ENDED"
  ended-subtitle: "&eA new RP interaction is needed"
  start-cancelled: "&7The PvP start was cancelled."
  no-situation: "&cYou have no PvP situation to end."
  # Shown by /pvp lethal before it is confirmed. Use \n for new lines.
  lethal-warning: "&c&l⚠ Lethal PvP\n&7In a &f/pvp start &7fight, anyone you kill gets a strike at once. You decided not to spare anyone when you turned lethal on, so you can't spare, wound or maim them.\n&7If it's their last strike, or they're in an evil RP session, their character dies and only you can open their grave.\n&7Players you kill outside &f/pvp start &7fights get no strike.\n&7Lethal lasts until you log out, switch character or run &f/pvp nonlethal&7."
  lethal-confirm-button: "&c&l[Confirm]"
  lethal-confirm-hover: "&7Turn on lethal PvP for this character"
  # {seconds} = lethal-confirm-seconds
  lethal-confirm-prompt: "&7Click &c[Confirm] &7or run &f/pvp lethal confirm &7within {seconds} seconds."
  lethal-confirm-none: "&cRun &f/pvp lethal &cfirst, then confirm within {seconds} seconds."
  already-lethal: "&7This character is already in lethal PvP."
  lethal: "&cThis character is now in lethal PvP. &7It goes back to nonlethal when you log out, switch character or run &f/pvp nonlethal&7."
  nonlethal: "&aThis character is now in nonlethal PvP."
  # Shown (at most once a second) when a knocked out player tries to fight or use an item.
  downed-blocked: "&cYou're knocked out. You can still talk, but you can't do that."
  # Sent to a player struck by a lethal kill. {killer} = the killer's display name.
  auto-strike-victim: "&c{killer} &cwas in lethal PvP, so their kill gave you a strike."
  usage: "&7Usage: /pvp start | end | lethal | nonlethal"
  no-character: "&cYou need an active character to set PvP mode."
  current: "&7This character's PvP mode: {mode}"
  players-only: "&cPlayers only."
  don-progress: "&eFastening your {piece} &7[{bar}&7] &f{seconds}s{queued}"
  don-queued: " &7(+{count} queued)"
  don-done: "&aYou've put on your {piece}."
  don-interrupted: "&cYou stopped fastening your {piece}."
  don-missing: "&cYou no longer have the {piece} you were putting on."
