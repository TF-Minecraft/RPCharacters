# /duel: a friendly fight between two players that nobody dies or loses anything in.
#
# Look at a player (or name them) and run /duel. They accept or decline from chat.
# After a short countdown only the two of them can hurt each other. When the duel
# ends, each gets back the health the other took, and hunger, saturation, mana,
# stamina, burning and potion effects go back to how they were at the start.
# Debuffs a player already had stay, with the time they had left, so a duel never
# cleanses or heals anything the duel didn't cause.
#
# A blow from the opponent that would kill ends the duel instead: no death,
# knockout, grave, dropped items or strike. Burning, poison and wither with no
# attacker count as the opponent's when they hit you in the last 30 seconds.
# Burning stops counting once you step in fire or lava yourself, so lava can
# still kill a duellist.
#
# Everything else stays real. A hit from a third player or a mob, or a duellist
# hitting a mob, interrupts the duel at once and only the duel's own damage is
# given back, so a duel can't be used as a shield, a free heal or free mana.
# Duellists can't hurt bystanders. /pvp start,
# a SimpleFactions battle, logging out, dying, leaving survival or moving too
# far apart ends the duel as a draw. Duels follow WorldGuard's pvp flag like any
# other fight.

# The target must be within this many blocks to be challenged or to accept.
challenge-range: 16
# Seconds a challenge stays open.
challenge-seconds: 30
# Seconds of countdown before hits count. 0 starts at once.
countdown-seconds: 3
# Moving further apart than this ends the duel as a draw.
leash-range: 32
# The longest a duel can last, in minutes. 0 for no limit.
max-minutes: 10
# Players this close see when a duel starts and who won. 0 tells nobody.
announce-radius: 24

